<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3b5bdb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="復習">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>復習リマインダー</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--tx:#1d1d1b;--sub:#6b6a65;--ac:#3b5bdb;--acx:#fff;--bd:#e2e0d8;--r0:#e03131;--r1:#e8890c;--r2:#2f9e44;--r3:#1c7ed6;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#151514;--card:#222220;--tx:#eeeeea;--sub:#9a9993;--ac:#748ffc;--acx:#10131f;--bd:#363633;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#151514;--card:#222220;--tx:#eeeeea;--sub:#9a9993;--ac:#748ffc;--acx:#10131f;--bd:#363633;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;line-height:1.6}
main{max-width:560px;margin:0 auto;padding:10px 12px 80px}
h1{font-size:17px;margin:0 0 8px}
.stats{display:flex;gap:6px;margin-bottom:8px}
.stat{flex:1;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:5px;text-align:center}
.stat b{display:block;font-size:18px}
.stat span{font-size:11px;color:var(--sub)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:8px}
.front{font-size:18px;white-space:pre-wrap;min-height:40px}
.back{margin-top:10px;padding-top:10px;border-top:1px dashed var(--bd);white-space:pre-wrap;color:var(--sub)}
.tag{display:inline-block;font-size:11px;background:var(--bd);border-radius:99px;padding:1px 9px;margin:0 4px 8px 0;color:var(--sub)}
.meta{font-size:12px;color:var(--sub);margin:0 0 4px}
.note{font-size:12px;color:var(--sub);margin:4px 0 8px}
button{font:inherit;border:0;border-radius:12px;padding:10px;cursor:pointer;background:var(--ac);color:var(--acx);width:100%}
button.ghost{background:transparent;color:var(--sub);border:1px solid var(--bd)}
button:disabled{opacity:.4;cursor:default}
.rates{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-bottom:4px}
.rates button{padding:10px 2px;font-size:26px;color:#fff;line-height:1.2}
.pk{display:flex;flex-wrap:wrap;gap:4px;margin:0 0 6px}
.pk button{width:auto;padding:5px 10px;background:transparent;color:var(--tx);border:1px solid var(--bd);font-size:14px}
.pk button.on{background:var(--ac);color:var(--acx);border-color:var(--ac);font-weight:700}
input,textarea,select{width:100%;font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:8px;margin-bottom:6px}
textarea{min-height:80px;resize:vertical}
.row{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;padding:10px 0;border-bottom:1px solid var(--bd);font-size:14px}
.row small{color:var(--sub);display:block}
.row .x{width:auto;padding:4px 10px;background:transparent;color:var(--r0);border:1px solid var(--bd);font-size:12px;margin-left:4px}
.row .x.u{color:var(--ac)}
.empty{text-align:center;color:var(--sub);padding:40px 0}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:20px;z-index:20}
.iv{margin:4px 0 6px}
.ivh{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--sub)}
.ivh b{font-size:18px;color:var(--tx)}
.ivt{display:flex;align-items:baseline;gap:8px}
.seg{display:flex;gap:2px}
.seg button{width:auto;padding:3px 10px;font-size:12px;background:transparent;color:var(--sub);border:1px solid var(--bd);border-radius:8px}
.seg button.on{background:var(--ac);color:var(--acx);border-color:var(--ac)}
input.rg{border:0;padding:0;background:transparent;margin:4px 0 0;height:26px;accent-color:var(--ac)}
.tks{position:relative;height:42px}
.tk{position:absolute;top:0;transform:translateX(-50%);width:auto;padding:11px 4px;font-size:14px;background:transparent;color:var(--sub);border-radius:10px}
.tk.on{background:var(--ac);color:var(--acx)}
.gm{display:block;margin:6px auto;width:170px;max-width:55%}
.shake{animation:shake .25s infinite}
@keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-3deg)}75%{transform:rotate(3deg)}}
.spin{transform-origin:100px 162px;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.pop{animation:pop .5s ease-out}
@keyframes pop{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.shake,.spin,.pop{animation:none}}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{background:transparent;color:var(--sub);padding:8px;font-size:13px}
nav button.on{color:var(--ac);font-weight:700}
</style>
</head>
<body>
<main id="app"></main>
<nav id="nav"></nav>
<script>
'use strict';
/* ===== 定数と状態 ===== */
var KEY = 'fukushu-v1', PREV = 'fukushu-v1-prev';
var OPTS = [1, 3, 7, 11, 14, 18, 21];            // 復習間隔の候補（日）
var SYM = ['×', '△', '○', '◎'];                  // 手応えの記号
var COLORS = ['--r0', '--r1', '--r2', '--r3'];
var TABS = [['today', '復習'], ['add', '追加'], ['list', '学習中'], ['gacha', 'ガチャ'], ['set', '設定']];
var S = { items: [], log: {}, sort: 'due' };       // 保存されるデータ
var ui = { tab: 'today', queue: [], shown: {}, pick: {}, filter: '', openId: null, delId: null, pending: null, msg: '', bk: '', addTag: '', editTag: '', df: '', db: '', def: null, rtag: '', ltag: '', delTag: null, sel: {}, anim: false };

var SORTS = [
  ['due', '次回が近い順', function (a, b) { return a.due < b.due ? -1 : a.due > b.due ? 1 : 0; }],
  ['new', '追加が新しい順', function (a, b) { return b.created - a.created; }],
  ['old', '追加が古い順', function (a, b) { return a.created - b.created; }],
  ['nmore', '復習回数が多い順', function (a, b) { return b.n - a.n; }],
  ['nless', '復習回数が少ない順', function (a, b) { return a.n - b.n; }],
  ['ivlong', '間隔が長い順', function (a, b) { return b.iv - a.iv; }],
  ['ivshort', '間隔が短い順', function (a, b) { return a.iv - b.iv; }],
  ['tag', 'タグ順', function (a, b) { return (a.tag || '~').localeCompare(b.tag || '~'); }]
];

/* ===== ユーティリティ ===== */
function $(id) { return document.getElementById(id); }
function ymd(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function today() { return ymd(new Date()); }
function key(d) { return ymd(d) + 'T' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); }
function nowKey() { return key(new Date()); }                                   // 例: 2026-11-22T13:05（日付だけの期限とも文字で比べられる）
function dueAfter(n) { return n < 1 ? key(new Date(Date.now() + n * 86400000)) : addDays(today(), n); }   // 1日未満は時刻つき
function ivLabel(n) { return n < 1 ? Math.round(n * 24) + '時間後' : n + '日後'; }
function dueLabel(i) { return i.due <= nowKey() ? '今日' : (i.due.length > 10 ? i.due.slice(5).replace('T', ' ') : i.due); }
function addDays(s, n) { var d = new Date(s + 'T00:00:00'); d.setDate(d.getDate() + n); return ymd(d); }
function esc(t) { return String(t == null ? '' : t).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function byId(id) { return S.items.find(function (i) { return i.id === id; }); }
function sym(r) { return r == null ? '指' : SYM[r]; }
function symStr(it, k) { return it.hist.slice(-k).map(function (x) { return sym(x.r); }).join(' '); }
function ivText(it) { return ivLabel(it.iv); }

/* ===== 保存と読み込み（旧バージョンのデータもここで整える） ===== */
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
function load() {
  try { var raw = localStorage.getItem(KEY); if (raw) S = JSON.parse(raw); } catch (e) {}
  normalize();
}
function normalize() {
  if (!S.items) S.items = [];
  if (!S.log) S.log = {};
  if (!Array.isArray(S.tags)) S.tags = [];
  if (S.rsort !== 'tag') S.rsort = 'due';
  if (!Array.isArray(S.prizes)) S.prizes = [];
  if (!Array.isArray(S.gacha)) S.gacha = [];
  if (S.gacha.some(function (g) { return g && 'hit' in g; })) {   // 旧形式の記録を「選んだ内容だけ」に整理
    var td = S.gacha.filter(function (g) { return g && g.d === today(); })[0];
    if (td && !S.lastDraw) S.lastDraw = { d: td.d, hit: td.hit, prize: td.prize };
    S.gacha = S.gacha.filter(function (g) { return g && g.hit && g.prize != null; }).map(function (g) { return { d: g.d, prize: g.prize }; });
  }
  if (!S.lastDraw) S.lastDraw = null;
  if (!SORTS.some(function (s) { return s[0] === S.sort; })) S.sort = 'due';
  S.items.forEach(function (i) {
    if (i.n == null) i.n = i.reps || 0;
    if (!(i.iv > 0)) i.iv = i.interval > 0 ? i.interval : 1;
    if (!Array.isArray(i.hist)) i.hist = [];
    i.back = i.back || ''; i.tag = i.tag || '';
    if (!i.created) i.created = parseInt(String(i.id).slice(0, 8), 36) || 0;
    if (typeof i.due !== 'string' || i.done || i.learning || i.due > '9000') i.due = today();
    ['interval', 'step', 'done', 'learning', 'reps'].forEach(function (k) { delete i[k]; });
    if (i.tag && S.tags.indexOf(i.tag) < 0) S.tags.push(i.tag);
  });
}

/* ===== カードの操作 ===== */
function buildQueue() {
  var t = today();
  ui.queue = S.items.filter(function (i) { return i.due <= nowKey() && tagMatch(i, ui.rtag); })
    .sort(function (a, b) { var c = S.rsort === 'tag' ? (a.tag || '~').localeCompare(b.tag || '~') : 0; return c || (a.due < b.due ? -1 : 1); })
    .map(function (i) { return i.id; });
  ui.sel = {}; ui.pick = {}; ui.shown = {};
}
function rate(id, r) {
  var it = byId(id), t = today();
  if (!it) return;
  if (ui.pick[id]) it.iv = ui.pick[id];
  it.n++;
  it.hist.push({ d: t, r: r, iv: it.iv });
  it.due = dueAfter(it.iv);
  ui.queue = ui.queue.filter(function (x) { return x !== id; });
  S.log[t] = (S.log[t] || 0) + 1;
  save();
}
function addCard() {
  var f = $('f').value.trim();
  if (!f) return false;
  S.items.push({
    id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
    front: f, back: $('b').value.trim(), tag: ui.addTag,
    iv: 1, n: 0, hist: [], created: Date.now(), due: today()
  });
  save(); buildQueue();
  return true;
}
function saveEdit() {
  var it = byId(ui.openId), f = $('ef').value.trim();
  if (!f) return false;
  it.front = f; it.back = $('eb').value.trim(); it.tag = ui.editTag; ui.def = null;
  var v = parseInt($('ei').value, 10);
  if (v >= 1) {
    if (v !== it.iv && it.n > 0) it.due = addDays(it.hist.length ? it.hist[it.hist.length - 1].d : today(), v);
    it.iv = v;
  }
  save(); ui.openId = null;
  return true;
}
function deleteCard() {
  S.items = S.items.filter(function (i) { return i.id !== ui.delId; });
  if (ui.openId === ui.delId) ui.openId = null;
  ui.delId = null; save(); buildQueue();
}
function readPrev() {
  try { var r = localStorage.getItem(PREV); return r ? JSON.parse(r) : null; } catch (e) { return null; }
}
function checkImport() {
  var txt = $('bk').value, d;
  ui.bk = txt; ui.msg = '';
  if (!txt.trim()) { ui.msg = '復元したいデータを、上のボックスに貼り付けてください。'; return; }
  try { d = JSON.parse(txt); } catch (e) { ui.msg = 'データの形式が正しくありません。書き出したデータをそのまま貼り付けてください。'; return; }
  if (!d || !Array.isArray(d.items)) { ui.msg = 'このアプリの書き出しデータではないようです。'; return; }
  var ok = d.items.filter(function (i) { return i && typeof i.id === 'string' && typeof i.front === 'string' && i.front.trim(); });
  ui.pending = { kind: 'import', cards: ok.length, skipped: d.items.length - ok.length,
    data: { items: ok, log: d.log && typeof d.log === 'object' ? d.log : {}, sort: d.sort, rsort: d.rsort,
      tags: Array.isArray(d.tags) ? d.tags.filter(function (x) { return typeof x === 'string'; }) : [],
      prizes: Array.isArray(d.prizes) ? d.prizes.filter(function (x) { return typeof x === 'string'; }) : [],
      gacha: Array.isArray(d.gacha) ? d.gacha.filter(function (g) { return g && typeof g.d === 'string'; }) : [],
      lastDraw: d.lastDraw } };
}
function askUndo() {
  var p = readPrev();
  if (p && Array.isArray(p.items)) ui.pending = { kind: 'undo', cards: p.items.length, skipped: 0, data: p };
}
function applyPending() {
  var p = ui.pending, before = JSON.stringify(S);
  S = p.data; normalize();
  try { localStorage.setItem(PREV, before); } catch (e) {}
  save(); buildQueue();
  ui.msg = (p.kind === 'undo' ? '復元前の状態に戻しました' : '復元しました') + '（カード' + S.items.length + '枚）';
  ui.pending = null;
}
function streak() {
  var d = today(), c = 0;
  if (!S.log[d]) d = addDays(d, -1);
  while (S.log[d]) { c++; d = addDays(d, -1); }
  return c;
}

/* ===== 画面の部品 ===== */
function tagMatch(i, f) { return !f || (f === '__none' ? !i.tag : i.tag === f); }
function makeTag(name) {
  name = name.trim();
  if (name && S.tags.indexOf(name) < 0) { S.tags.push(name); save(); }
  return name;
}
function removeTag() {
  var g = ui.delTag;
  S.tags = S.tags.filter(function (x) { return x !== g; });
  S.items.forEach(function (i) { if (i.tag === g) i.tag = ''; });
  if (ui.addTag === g) ui.addTag = '';
  if (ui.editTag === g) ui.editTag = '';
  if (ui.rtag === g) ui.rtag = '';
  if (ui.ltag === g) ui.ltag = '';
  ui.delTag = null; save(); buildQueue();
}
function tagOptions(sel, allLabel) {
  var h = '<option value="">' + allLabel + '</option>';
  S.tags.forEach(function (g) { h += '<option value="' + esc(g) + '"' + (sel === g ? ' selected' : '') + '>' + esc(g) + '</option>'; });
  return h + '<option value="__none"' + (sel === '__none' ? ' selected' : '') + '>タグなし</option>';
}
function tagPicker(sel, act) {
  var h = '<p class="note" style="margin:0 0 6px">タグ（タップで選択・もう一度で外す）</p><div class="pk">';
  if (!S.tags.length) h += '<span class="note" style="margin:0">タグがまだありません。下で作れます。</span>';
  S.tags.forEach(function (g) { h += '<button data-act="' + act + '" data-v="' + esc(g) + '" class="' + (g === sel ? 'on' : '') + '">' + esc(g) + '</button>'; });
  return h + '</div><div style="display:flex;gap:6px"><input id="nt" placeholder="新しいタグ名" style="margin-bottom:12px"><button data-act="mktag" class="ghost" style="width:auto;white-space:nowrap;margin-bottom:12px">作る</button></div>';
}
function stat(v, label) { return '<div class="stat"><b>' + v + '</b><span>' + label + '</span></div>'; }
function tagHtml(it) { return it.tag ? '<span class="tag">' + esc(it.tag) + '</span>' : ''; }
function histHtml(it) { return it.hist.length ? '<p class="meta" style="margin:10px 0 0">手応えの記録: ' + symStr(it, 12) + '</p>' : ''; }
function pickHead(n) {
  var d = new Date(today() + 'T00:00:00'), p = function (x) { return String(x).padStart(2, '0'); }, when;
  if (n < 1) { d = new Date(Date.now() + n * 86400000); when = p(d.getHours()) + ':' + p(d.getMinutes()) + '頃'; }
  else { d.setDate(d.getDate() + n); when = (d.getMonth() + 1) + '/' + d.getDate() + '（' + '日月火水木金土'[d.getDay()] + '）'; }
  return '<b>' + ivLabel(n) + '</b><span>' + when + '</span>';
}
function ivPick(sel, id) {   // スライダー（時間: 3〜12時間を1時間刻み ／ 日: 1〜21日）＋目盛り。目盛りはタップでも選べる
  var hours = sel < 1, lo, hi, cur, marks = [];
  if (hours) { lo = 3; hi = 12; cur = Math.round(sel * 24); for (var h = lo; h <= hi; h++) marks.push([h / 24, h]); }
  else { lo = 1; hi = Math.max(21, sel); cur = sel; OPTS.forEach(function (o) { marks.push([o, o]); }); }
  var ticks = marks.map(function (m) {
    return '<button data-act="pick" data-v="' + id + '" data-d="' + m[0] + '" class="tk' + (m[1] === cur ? ' on' : '') + '" style="left:calc(11px + (100% - 22px) * ' + ((m[1] - lo) / (hi - lo)) + ')">' + m[1] + '</button>';
  }).join('');
  var seg = '<span class="seg"><button data-act="unit" data-v="' + id + '" data-u="h" class="' + (hours ? 'on' : '') + '">時間</button><button data-act="unit" data-v="' + id + '" data-u="d" class="' + (hours ? '' : 'on') + '">日</button></span>';
  return '<div class="iv"><div class="ivh"><span class="ivt">' + pickHead(sel) + '</span>' + seg + '</div>'
    + '<input type="range" class="rg" data-slide="' + id + '" data-u="' + (hours ? 'h' : 'd') + '" min="' + lo + '" max="' + hi + '" step="1" value="' + cur + '"><div class="tks">' + ticks + '</div></div>';
}
function rateLabel(id) {
  var sel = ui.sel[id];
  return sel == null ? '手応えを選んでください' : '決定（' + SYM[sel] + ' ・ ' + ivLabel(ui.pick[id]) + '）';
}

/* ===== 各タブの画面 ===== */
function viewToday() {
  var ctl = '';
  if (S.tags.length) ctl = '<div style="display:flex;gap:6px"><select id="rt">' + tagOptions(ui.rtag, 'すべてのタグ') + '</select><select id="rs"><option value="due"' + (S.rsort === 'due' ? ' selected' : '') + '>期限順</option><option value="tag"' + (S.rsort === 'tag' ? ' selected' : '') + '>タグ順</option></select></div>';
  return ctl + viewTodayBody();
}
function viewTodayBody() {
  if (!ui.queue.length) return '<div class="empty">' + (S.items.length ? '🎉 今日の復習は全部おわり！' : 'まず「追加」から項目を入れよう') + '</div>';
  var h = '<p class="note" style="margin:0 0 6px">今日の復習 ' + ui.queue.length + ' 件<br>× 忘れた ・ △ あやしい ・ ○ 思い出せた ・ ◎ 余裕（記録だけで、日数には影響しません）</p>';
  ui.queue.forEach(function (id) { var it = byId(id); if (it) h += viewReviewCard(it); });
  return h;
}
function viewReviewCard(it) {
  var id = it.id, ready = ui.shown[id] || !it.back, sel = ui.sel[id];
  if (ui.pick[id] == null) ui.pick[id] = it.iv;
  var h = '<div class="card">' + tagHtml(it) + '<p class="meta">これまで ' + it.n + '回復習 ・ 復習間隔 ' + ivText(it) + '</p>'
    + '<div class="front">' + esc(it.front) + '</div>'
    + (ready && it.back ? '<div class="back">' + esc(it.back) + '</div>' : '') + histHtml(it);
  if (!ready) return h + '<button data-act="show" data-v="' + id + '" style="margin-top:8px">答えを見る</button></div>';
  h += '<div class="rates" style="margin-top:8px">';
  SYM.forEach(function (s, r) {
    h += '<button data-act="sel" data-v="' + id + '" data-r="' + r + '" style="background:var(' + COLORS[r] + ');opacity:' + (sel == null || sel === r ? 1 : 0.4) + ';' + (sel === r ? 'outline:3px solid var(--tx);outline-offset:1px' : '') + '">' + s + '</button>';
  });
  return h + '</div><p class="note" style="margin:4px 0">次の復習日</p>' + ivPick(ui.pick[id], id)
    + '<button data-act="rate" data-v="' + id + '"' + (sel == null ? ' disabled' : '') + '>'
    + rateLabel(id) + '</button></div>';
}
/* ===== ガチャ ===== */
var HIT_RATE = 0.7;   // あたり確率（固定）
function gachaState() {
  var t = today(), d = S.lastDraw;
  return {
    due: S.items.filter(function (i) { return i.due <= nowKey(); }).length,
    done: (S.log[t] || 0) > 0,
    todays: d && d.d === t ? d : null
  };
}
function drawGacha() {
  var st = gachaState();
  if (st.todays || st.due > 0 || !st.done || !S.prizes.length) return false;
  S.lastDraw = { d: today(), hit: Math.random() < HIT_RATE, prize: null };   // 引いた結果は先に保存（引き直し防止）
  save();
  return true;
}
function pickPrize(i) {
  var g = gachaState().todays;
  if (g && g.hit && g.prize == null && S.prizes[i] != null) {
    g.prize = S.prizes[i];
    S.gacha.push({ d: g.d, prize: g.prize });   // 記録するのは、選んだあたりの内容だけ
    save();
  }
}
function addPrize() {
  var n = $('np').value.trim();
  if (!n || S.prizes.indexOf(n) >= 0) return false;
  S.prizes.push(n); save();
  return true;
}
function prizeCard() {
  var h = '<div class="card"><b style="font-size:14px">ガチャのあたりの内容</b><p class="note">あたりが出たとき、この中から1つ選べます。（あたり70% ・ はずれ30%は固定です）</p>';
  if (!S.prizes.length) h += '<p class="note">まだありません</p>';
  S.prizes.forEach(function (n, i) {
    h += '<div class="row"><span>' + esc(n) + '</span><button class="x" data-act="delprize" data-v="' + i + '">削除</button></div>';
  });
  return h + '<div style="display:flex;gap:6px;margin-top:8px"><input id="np" placeholder="例: 好きなお菓子を食べる" style="margin-bottom:0"><button data-act="addprize" class="ghost" style="width:auto;white-space:nowrap">追加</button></div></div>';
}
function machineSvg(cls) {
  var balls = [[72, 62, '--r0'], [104, 46, '--r3'], [128, 74, '--r1'], [86, 96, '--r2'], [114, 104, '--r0'], [68, 92, '--r3'], [100, 74, '--r1']];
  var s = '<svg class="gm ' + cls + '" viewBox="0 0 200 240" aria-hidden="true">'
    + '<circle cx="100" cy="82" r="64" style="fill:var(--bd);fill-opacity:.55;stroke:var(--sub);stroke-width:3"/>';
  balls.forEach(function (b) {
    s += '<circle cx="' + b[0] + '" cy="' + b[1] + '" r="15" style="fill:var(' + b[2] + ')"/><path d="M' + (b[0] - 15) + ' ' + b[1] + 'h30" style="stroke:#fff;stroke-width:2;opacity:.8"/>';
  });
  return s + '<rect x="38" y="138" width="124" height="86" rx="16" style="fill:var(--ac)"/>'
    + '<rect x="72" y="186" width="56" height="28" rx="8" style="fill:var(--bg)"/>'
    + '<g class="' + (cls ? 'spin' : '') + '"><circle cx="100" cy="162" r="17" style="fill:var(--card)"/><rect x="95" y="147" width="10" height="30" rx="5" style="fill:var(--sub)"/></g></svg>';
}
function viewGacha() {
  var st = gachaState(), g = st.todays, big = 'text-align:center;min-height:0;margin:8px 0';
  var h = '<div class="card"><b style="font-size:14px">🎰 今日のガチャ</b>' + machineSvg(ui.anim ? 'shake' : '');
  if (ui.anim) {
    h += '<div class="front" style="' + big + '">ガチャガチャ…</div>';
  } else if (g) {
    if (!g.hit) h += '<div class="front pop" style="' + big + '">はずれ…また明日！</div>';
    else if (g.prize != null) h += '<div class="front pop" style="' + big + '">🎉 あたり！<br>「' + esc(g.prize) + '」</div>';
    else if (!S.prizes.length) h += '<div class="front pop" style="' + big + '">🎉 あたり！</div><p class="note" style="text-align:center">「設定」タブであたりの内容を登録すると、選べます。</p>';
    else {
      h += '<div class="front pop" style="' + big + '">🎉 あたり！</div><p class="note" style="text-align:center">好きなものを1つ選んでください（タップで決定）</p><div class="pk" style="justify-content:center">';
      S.prizes.forEach(function (n, i) { h += '<button data-act="prize" data-v="' + i + '">' + esc(n) + '</button>'; });
      h += '</div>';
    }
    h += '<p class="note" style="text-align:center">今日はもう引きました。次は明日です。</p>';
  } else if (!S.prizes.length) {
    h += '<p class="note" style="text-align:center">「設定」タブで、あたりの内容を1つ以上登録してください。</p><button data-act="tab" data-v="set" class="ghost">設定を開く</button>';
  } else if (st.due > 0) {
    h += '<p class="note" style="text-align:center">復習があと' + st.due + '件残っています。全部終えると引けます。</p><button disabled>ガチャを引く</button>';
  } else if (!st.done) {
    h += '<p class="note" style="text-align:center">今日はまだ復習していません。1枚以上復習すると引けます。</p><button disabled>ガチャを引く</button>';
  } else {
    h += '<p class="note" style="text-align:center">復習おつかれさま！1日1回、あたり70% ・ はずれ30%</p><button data-act="draw">ガチャを引く</button>';
  }
  h += '</div><div class="card"><b style="font-size:14px">記録（選んだあたり）</b>';
  if (!S.gacha.length) return h + '<p class="note">まだ記録がありません</p></div>';
  var cnt = {};
  S.gacha.forEach(function (x) { cnt[x.prize] = (cnt[x.prize] || 0) + 1; });
  Object.keys(cnt).sort(function (a, b) { return cnt[b] - cnt[a]; }).forEach(function (k) {
    h += '<div style="font-size:13px;margin-top:6px">' + esc(k) + ' ・ ' + cnt[k] + '回</div><div style="background:var(--bd);border-radius:4px;height:6px"><div style="background:var(--ac);border-radius:4px;height:6px;width:' + Math.round(cnt[k] * 100 / S.gacha.length) + '%"></div></div>';
  });
  h += '<p class="note" style="margin-bottom:0">履歴（新しい順）</p>';
  S.gacha.slice(-20).reverse().forEach(function (x) {
    h += '<div class="row"><span>' + x.d + '</span><span>「' + esc(x.prize) + '」</span></div>';
  });
  return h + '</div>';
}
function viewAdd() {
  return '<div class="card"><textarea id="f" placeholder="問題・覚えたいこと">' + esc(ui.df) + '</textarea>'
    + '<textarea id="b" placeholder="答え・メモ（なくてもOK）">' + esc(ui.db) + '</textarea>'
    + tagPicker(ui.addTag, 'atag') + '<button data-act="add">追加する</button></div>';
}
function viewList() {
  if (ui.openId && byId(ui.openId)) return viewDetail(byId(ui.openId));
  var t = today();
  var fn = SORTS.filter(function (s) { return s[0] === S.sort; })[0][2];
  var h = '<select id="so">' + SORTS.map(function (s) { return '<option value="' + s[0] + '"' + (S.sort === s[0] ? ' selected' : '') + '>' + s[1] + '</option>'; }).join('') + '</select>';
  h += '<select id="tf">' + tagOptions(ui.ltag, 'すべてのタグ') + '</select>';
  h += '<input id="s" placeholder="検索" value="' + esc(ui.filter) + '">';
  var l = S.items.filter(function (i) { return tagMatch(i, ui.ltag) && (i.front + i.back + i.tag).indexOf(ui.filter) >= 0; }).sort(fn);
  if (!l.length) h += '<div class="empty">項目がありません</div>';
  l.forEach(function (i) {
    h += '<div class="row"><div data-act="edit" data-v="' + i.id + '" style="flex:1;cursor:pointer">' + esc(i.front.slice(0, 60))
      + '<small>' + (i.tag ? esc(i.tag) + ' ・ ' : '') + '復習' + i.n + '回 ・ 間隔 ' + ivText(i) + ' ・ 次回 ' + dueLabel(i) + '</small>'
      + (i.hist.length ? '<small style="font-size:14px">' + symStr(i, 12) + '</small>' : '') + '</div>'
      + '<div style="display:flex"><button class="x u" data-act="edit" data-v="' + i.id + '">編集</button>'
      + '<button class="x" data-act="del" data-v="' + i.id + '">削除</button></div></div>';
  });
  return h;
}
function viewDetail(it) {
  var h = '<button data-act="back" class="ghost" style="margin-bottom:10px">← 一覧に戻る</button>';
  var dr = ui.def || { f: it.front, b: it.back, i: it.iv >= 1 ? it.iv : '' };
  h += '<div class="card"><textarea id="ef">' + esc(dr.f) + '</textarea><textarea id="eb" placeholder="答え・メモ">' + esc(dr.b) + '</textarea>'
    + tagPicker(ui.editTag, 'etag') + '<p class="note" style="margin:0 0 4px">復習間隔（日後）</p>'
    + '<input id="ei" type="number" min="1" inputmode="numeric" value="' + esc(dr.i) + '"><button data-act="save">保存</button></div>';
  h += '<div class="card"><b style="font-size:14px">復習の記録（' + it.n + '回）</b><p class="note">いまの間隔: ' + ivText(it) + '</p>';
  if (!it.hist.length) h += '<p class="note">まだ記録がありません</p>';
  it.hist.slice().reverse().forEach(function (x) {
    h += '<div class="row"><span>' + x.d + '</span><span style="font-size:18px">' + sym(x.r) + '</span><span style="color:var(--sub)">'
      + (x.iv < 0 ? '完了' : x.iv === 0 ? 'もう一度' : ivLabel(x.iv) + 'へ') + '</span></div>';
  });
  return h + '</div>';
}
function tagCard() {
  var h = '<div class="card"><b style="font-size:14px">タグの管理</b><p class="note">ここで作ったタグは、カードの追加・編集で選んで使い回せます。</p>';
  if (!S.tags.length) h += '<p class="note">まだタグがありません</p>';
  S.tags.forEach(function (g) {
    var n = S.items.filter(function (i) { return i.tag === g; }).length;
    h += '<div class="row"><span>' + esc(g) + ' <small style="display:inline">（' + n + '枚）</small></span><button class="x" data-act="deltag" data-v="' + esc(g) + '">削除</button></div>';
  });
  return h + '<div style="display:flex;gap:6px;margin-top:12px"><input id="nt" placeholder="新しいタグ名" style="margin-bottom:0"><button data-act="mktag" class="ghost" style="width:auto;white-space:nowrap">作る</button></div></div>';
}
function viewDelTag(g) {
  var n = S.items.filter(function (i) { return i.tag === g; }).length;
  return '<div class="modal"><div class="card" style="margin:0;max-width:360px;width:100%"><b>タグ「' + esc(g) + '」を削除しますか？</b>'
    + '<p class="note" style="margin:8px 0 14px">このタグがついた' + n + '枚のカードからタグを外します。カード自体は消えません。</p>'
    + '<button data-act="tagyes" style="background:var(--r0);margin-bottom:8px">削除する</button><button data-act="tagno" class="ghost">キャンセル</button></div></div>';
}
function viewSettings() {
  var p = readPrev();
  var h = tagCard() + prizeCard() + '<div class="card"><b style="font-size:14px">バックアップ</b><p class="note">ブラウザを変える時は、「書き出し」で出たデータを控え、新しい方に貼り付けて復元します。</p>'
    + '<textarea id="bk">' + esc(ui.bk) + '</textarea><button class="ghost" data-act="export" style="margin-bottom:8px">書き出し</button>'
    + '<button class="ghost" data-act="import">内容を確認して復元</button>'
    + (ui.msg ? '<p class="note" style="margin:10px 0 0;color:var(--tx)">' + esc(ui.msg) + '</p>' : '') + '</div>';
  if (p && Array.isArray(p.items)) h += '<div class="card"><b style="font-size:14px">復元前の状態</b><p class="note">復元する直前のデータ（カード' + p.items.length + '枚）を1つだけ控えています。</p><button class="ghost" data-act="undo">復元前の状態に戻す</button></div>';
  return h;
}
function viewPending(p) {
  var undo = p.kind === 'undo';
  return '<div class="modal"><div class="card" style="margin:0;max-width:360px;width:100%"><b>' + (undo ? '復元前の状態に戻しますか？' : 'このデータで復元しますか？') + '</b>'
    + '<p class="note" style="margin:8px 0 14px">復元後のカード: ' + p.cards + '枚（いまは' + S.items.length + '枚）'
    + (p.skipped ? '<br>読み取れないカード' + p.skipped + '枚は除きます。' : '')
    + '<br>いまのデータは上書きされますが、' + (undo ? 'この操作もあとで元に戻せます。' : '直前の状態を1つ控えて、あとで戻せます。') + '</p>'
    + '<button data-act="impyes" style="margin-bottom:8px">' + (undo ? '戻す' : '復元する') + '</button><button data-act="impno" class="ghost">キャンセル</button></div></div>';
}
function viewDelete(it) {
  return '<div class="modal"><div class="card" style="margin:0;max-width:360px;width:100%"><b>このカードを削除しますか？</b>'
    + '<p class="note" style="margin:8px 0 14px">' + esc(it.front.slice(0, 60)) + '<br>削除すると復習の記録も消え、元に戻せません。</p>'
    + '<button data-act="delyes" style="background:var(--r0);margin-bottom:8px">削除する</button><button data-act="delno" class="ghost">キャンセル</button></div></div>';
}

/* ===== 描画 ===== */
function render() {
  var t = today();
  var due = S.items.filter(function (i) { return i.due <= nowKey(); }).length;
  var h = '<h1>🧠 復習リマインダー</h1><div class="stats">' + stat(due, '今日の復習') + stat(S.log[t] || 0, '今日やった数') + stat(streak(), '連続日数') + '</div>';
  h += { today: viewToday, add: viewAdd, list: viewList, gacha: viewGacha, set: viewSettings }[ui.tab]();
  if (ui.delId && byId(ui.delId)) h += viewDelete(byId(ui.delId));
  if (ui.pending) h += viewPending(ui.pending);
  if (ui.delTag) h += viewDelTag(ui.delTag);
  $('app').innerHTML = h;
  $('nav').innerHTML = TABS.map(function (x) {
    return '<button data-act="tab" data-v="' + x[0] + '" class="' + (ui.tab === x[0] ? 'on' : '') + '">' + x[1] + '</button>';
  }).join('');
}

/* ===== 操作の受け付け ===== */
document.addEventListener('click', function (e) {
  var el = e.target.closest('[data-act]');
  if (!el) return;
  var a = el.dataset.act, v = el.dataset.v;
  if ($('f')) { ui.df = $('f').value; ui.db = $('b').value; }
  if ($('ef')) ui.def = { f: $('ef').value, b: $('eb').value, i: $('ei').value };
  if (a === 'tab') { ui.tab = v; ui.openId = null; ui.msg = ''; ui.pending = null; if (v === 'today') buildQueue(); }
  else if (a === 'show') ui.shown[v] = true;
  else if (a === 'draw') { if (drawGacha()) { ui.anim = true; setTimeout(function () { ui.anim = false; render(); }, 1300); } }
  else if (a === 'prize') pickPrize(+v);
  else if (a === 'addprize') { if (!addPrize()) return; }
  else if (a === 'delprize') { S.prizes.splice(+v, 1); save(); }
  else if (a === 'atag') ui.addTag = ui.addTag === v ? '' : v;
  else if (a === 'etag') ui.editTag = ui.editTag === v ? '' : v;
  else if (a === 'mktag') { var nm = makeTag($('nt').value); if (!nm) return; if (ui.tab === 'add') ui.addTag = nm; else if (ui.tab === 'list') ui.editTag = nm; }
  else if (a === 'deltag') ui.delTag = v;
  else if (a === 'tagno') ui.delTag = null;
  else if (a === 'tagyes') removeTag();
  else if (a === 'pick') ui.pick[v] = +el.dataset.d;
  else if (a === 'unit') { var toHours = el.dataset.u === 'h'; if (toHours !== (ui.pick[v] < 1)) ui.pick[v] = toHours ? 3 / 24 : 1; }
  else if (a === 'sel') ui.sel[v] = ui.sel[v] === +el.dataset.r ? null : +el.dataset.r;   // 同じ記号をもう一度押すと取り消し
  else if (a === 'rate') { if (ui.sel[v] == null) return; rate(v, ui.sel[v]); }
  else if (a === 'add') { if (!addCard()) return; ui.df = ''; ui.db = ''; }
  else if (a === 'edit') { ui.tab = 'list'; ui.openId = v; ui.def = null; ui.editTag = byId(v).tag; window.scrollTo(0, 0); }
  else if (a === 'back') ui.openId = null;
  else if (a === 'save') { if (!saveEdit()) return; }
  else if (a === 'del') ui.delId = v;
  else if (a === 'delno') ui.delId = null;
  else if (a === 'delyes') deleteCard();
  else if (a === 'export') { $('bk').value = JSON.stringify(S); $('bk').select(); return; }
  else if (a === 'import') checkImport();
  else if (a === 'undo') askUndo();
  else if (a === 'impyes') applyPending();
  else if (a === 'impno') ui.pending = null;
  render();
});
$('app').addEventListener('change', function (e) {
  if (e.target.id === 'so') { S.sort = e.target.value; save(); render(); }
  if (e.target.id === 'tf') { ui.ltag = e.target.value; render(); }
  if (e.target.id === 'rt') { ui.rtag = e.target.value; buildQueue(); render(); }
  if (e.target.id === 'rs') { S.rsort = e.target.value; save(); buildQueue(); render(); }
});
$('app').addEventListener('input', function (e) {
  if (e.target.dataset.slide) {   // スライダー: 描き直さず、表示だけ更新（操作が途切れないように）
    var sid = e.target.dataset.slide, raw = +e.target.value, box = e.target.closest('.iv');
    var val = e.target.dataset.u === 'h' ? raw / 24 : raw;
    ui.pick[sid] = val;
    box.querySelector('.ivt').innerHTML = pickHead(val);
    box.querySelectorAll('.tk').forEach(function (k) { k.classList.toggle('on', Math.abs(+k.dataset.d - val) < 1e-9); });
    var rb = document.querySelector('[data-act="rate"][data-v="' + sid + '"]');
    if (rb && ui.sel[sid] != null) rb.textContent = rateLabel(sid);
    return;
  }
  if (e.target.id !== 's') return;
  var p = e.target.selectionStart;
  ui.filter = e.target.value; render();
  var s = $('s'); s.focus(); s.setSelectionRange(p, p);
});

// 期限になったカードを、開いたままでも復習に足す（3時間後の設定用）
function refreshQueue() {
  var now = nowKey(), changed = false;
  S.items.forEach(function (i) {
    if (i.due <= now && tagMatch(i, ui.rtag) && ui.queue.indexOf(i.id) < 0) { ui.queue.push(i.id); changed = true; }
  });
  return changed;
}
document.addEventListener('visibilitychange', function () { if (!document.hidden && ui.tab === 'today' && refreshQueue()) render(); });
setInterval(function () { if (ui.tab === 'today' && refreshQueue()) render(); }, 60000);

load(); buildQueue(); render();

/* ===== オフライン対応（service worker） ===== */
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
}
</script>
</body>
</html>
